<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>profile card</title>
    <link rel="stylesheet" href="./01style.css">
</head>

<body>

    <div class="card">
        <div class="avatar">Student</div>
        <h1 class="name">Aditya Kumar</h1>
        <p class="branch">Computer Science Engineering</p>
        <p class="college">GLA University</p>
        <p class="bio">
            I am a passionate Computer Science student interested in Web Development, Java, and problem solving.
        </p>

        <h2 class="skills-title">Skills</h2>
        <div class="skills">
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill">Java</span>
            <span class="skill">Problem Solving</span>
        </div>

        <button class="contact-btn">Contact Me</button>
    </div>
</body>

</html>
